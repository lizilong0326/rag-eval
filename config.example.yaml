# 真实 HTTP 被测接口配置示例（复制为 config.yaml 使用；token 用环境变量，不写进文件）
endpoint:
  url: "http://127.0.0.1:8000/ask"
  allow_hosts: ["127.0.0.1", "localhost"]
  # allow_tokens: ["<被测接口凭据白名单>"]   # 默认拒绝未授权凭据
  timeout_seconds: 5.0
  retry: true

# 被测接口契约（HTTP POST，Bearer 鉴权）：
# 请求体：{"question_id": "Q01", "question": "...", "enterprise_id": "...", "version": "..."}
# 响应体：{"answer": "...", "citations": [{"doc_id": "...", "enterprise_id": "...", "version": "..."}],
#          "model_version": "...", "knowledge_version": "...", "latency_ms": 0}
